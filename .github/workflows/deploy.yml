name: Deploy Laravel via SSH and Rsync

on:
  push:
    branches:
      - master # Cambia esto por 'master' si es el nombre de tu rama principal

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # 1. Configurar la versión de PHP necesaria para tu Laravel
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4' 
          extensions: mbstring, xml, ctype, iconv, mysql, zip, bcmath
          coverage: none

      # 2. Instalar dependencias de Composer (Optimizado para producción)
      - name: Instalar dependencias de Composer
        run: |
          composer install --no-ansi --no-dev --no-interaction --no-plugins --no-progress --no-scripts --optimize-autoloader

      # 3. Desplegar con Rsync y Optimizar Laravel (Flujo Limpio y Robusto)
      - name: Desplegar y Optimizar Aplicación
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          # 1. Escribir y formatear la clave de forma ultra-segura
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/ssh_key
          sed -i 's/\r$//' /tmp/ssh_key
          chmod 600 /tmp/ssh_key
          
          # 2. Iniciar el agente y añadir la clave que YA está limpia
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          ssh-add /tmp/ssh_key
          
          # 3. Registrar el servidor en known_hosts
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts
          
          # 4. Asegurar de forma remota que la estructura de carpetas exista
          ssh -o IdentitiesOnly=yes "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "mkdir -p ~/www/uptamcy/"

          # 5. Ejecutar Rsync apuntando a ~/www/uptamcy/
          rsync -avz \
            -e "ssh -o IdentitiesOnly=yes" \
            --no-perms --no-owner --no-group \
            --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='.ssh/' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/sessions/*' \
            . "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}":~/www/uptamcy/

          # 6. Ejecutar comandos de producción en el servidor
          ssh -o IdentitiesOnly=yes "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" << 'EOF'
            cd ~/www/uptamcy/
            
            php artisan down
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan up
          EOF
 
 
